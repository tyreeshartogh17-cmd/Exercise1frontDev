<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextLevel Gaming Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header Section -->
  <header class="page-header">
    <h1>NEXTLEVEL GAMING</h1>
    <p>Consoles, controllers, and next-gen gear ready to play.</p>
  </header>

  <!-- Main Section with 6 Gaming Product Cards -->
  <main class="showcase-grid">
    
    <!-- Card 1: PlayStation 5 -->
    <article class="product-card" data-platform="playstation">
      <img src="https://placehold.co/300x200" alt="PlayStation 5 Console and Controller">
      <div class="card-content">
        <h2>PlayStation 5 Slim</h2>
        <span class="price">R11,999.00</span>
        <button type="button" class="cart-btn">Add to Cart</button>
      </div>
    </article>

    <!-- Card 2: Xbox Series X -->
    <article class="product-card" data-platform="xbox">
      <img src="https://placehold.co/300x200" alt="Xbox Series X Console">
      <div class="card-content">
        <h2>Xbox Series X 1TB</h2>
        <span class="price">R11,499.00</span>
        <button type="button" class="cart-btn">Add to Cart</button>
      </div>
    </article>

    <!-- Card 3: Nintendo Switch -->
    <article class="product-card" data-platform="nintendo">
      <img src="https://placehold.co/300x200" alt="Nintendo Switch Console">
      <div class="card-content">
        <h2>Nintendo Switch OLED</h2>
        <span class="price">R7,499.00</span>
        <button type="button" class="cart-btn">Add to Cart</button>
      </div>
    </article>

    <!-- Card 4: DualSense Controller -->
    <article class="product-card" data-platform="playstation">
      <img src="https://placehold.co/300x200" alt="Wireless Gaming Controller">
      <div class="card-content">
        <h2>DualSense Controller</h2>
        <span class="price">R1,499.00</span>
        <button type="button" class="cart-btn">Add to Cart</button>
      </div>
    </article>

    <!-- Card 5: Gaming Headset -->
    <article class="product-card" data-platform="pc">
      <img src="https://placehold.co/300x200" alt="Over-Ear Gaming Headset">
      <div class="card-content">
        <h2>Pro 7.1 Gaming Headset</h2>
        <span class="price">R2,299.00</span>
        <button type="button" class="cart-btn">Add to Cart</button>
      </div>
    </article>

    <!-- Card 6: Gaming Setup / Handheld PC -->
    <article class="product-card" data-platform="pc">
      <img src="https://placehold.co/300x200" alt="Gaming PC Gear">
      <div class="card-content">
        <h2>Handheld Gaming PC 512GB</h2>
        <span class="price">R13,999.00</span>
        <button type="button" class="cart-btn">Add to Cart</button>
      </div>
    </article>

  </main>

</body>
</html>
